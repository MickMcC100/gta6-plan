<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA 6 Plan">
<meta name="theme-color" content="#120d1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<title>GTA 6 – First 10 Hours Checklist</title>
<style>
:root{--night:#120d1f;--night-2:#1b1430;--night-3:#261d42;--line:#3a2e5c;--cream:#f6efe3;--muted:#b3a8c9;--sun-1:#ff5e8a;--sun-2:#ffb347;--teal:#3fd6c6;--ok:#4fdc8d;--warn:#ffc857;--bad:#ff7a9a;
--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--night)}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sun{background:linear-gradient(90deg,var(--sun-1),var(--sun-2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 85% 0%,rgba(255,94,138,.45),transparent 55%),radial-gradient(90% 70% at 10% 10%,rgba(123,47,247,.35),transparent 60%),radial-gradient(80% 60% at 60% 110%,rgba(63,214,198,.18),transparent 60%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(180deg,rgba(255,179,71,.10) 0 3px,transparent 3px 11px);mask:linear-gradient(180deg,transparent,#000 70%);-webkit-mask:linear-gradient(180deg,transparent,#000 70%)}
.hero .wrap{position:relative;z-index:1;padding-top:calc(env(safe-area-inset-top,0px) + 34px);padding-bottom:26px;display:grid;gap:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(52px,13vw,104px);line-height:.88;margin:0;text-transform:uppercase}
.lede{max-width:58ch;margin:0;color:var(--cream);font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:rgba(27,20,48,.8);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--cream);font-variant-numeric:tabular-nums}
.next{display:flex;gap:10px;align-items:center;background:rgba(27,20,48,.85);border:1px solid var(--line);border-left:3px solid var(--sun-2);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;text-align:left;width:100%}
.next small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun-2)}

/* rail */
.rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-block:18px 6px}
.tile{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:96px;background:var(--night-2);cursor:pointer;text-align:left;padding:0}
.tile .bg{position:absolute;inset:0;opacity:.55;transition:opacity .2s}
.tile svg{position:absolute;right:10px;top:10px;width:30px;height:30px;opacity:.9}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 15%,rgba(18,13,31,.9))}
.tile span{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;display:grid}
.tile strong{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;line-height:1}
.tile small{color:var(--muted);font-size:11px}
.tile em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--cream)}
.tile[aria-pressed="true"]{border-color:var(--sun-2);box-shadow:0 0 0 1px var(--sun-2) inset}
.tile[aria-pressed="true"] .bg{opacity:.9}
@media (max-width:760px){.rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.tile{flex:0 0 42%;scroll-snap-align:start}}

/* sticky controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(18,13,31,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.controls .wrap{padding-block:10px;display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;background:var(--night-3);border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:10px 12px 10px 38px;font:inherit;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.ibtn{flex:none;background:var(--night-3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.ibtn.on{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--night-2);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--night);background:linear-gradient(90deg,var(--sun-1),var(--sun-2));border-color:transparent;font-weight:700}
.pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun-1),var(--teal));transition:width .3s}

/* cards */
main .wrap{padding-block:18px calc(env(safe-area-inset-bottom,0px) + 60px)}
.sech{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
.sech h2{font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;margin:0;line-height:1}
.sech span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:14px;align-items:start}
.card{background:var(--night-2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.full{border-color:rgba(79,220,141,.5)}
.ch{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ch h3{flex:1;margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.cnt{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--night-3);border-radius:6px;padding:3px 7px;white-space:nowrap}
.card.full .cnt{background:var(--ok);color:var(--night);font-weight:700}
.chev{color:var(--muted);font-size:12px;transition:transform .2s}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .cb{display:none}
.mini{height:3px;background:var(--night-3);margin:0 14px}
.mini i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.cb{padding:4px 14px 12px}
h4{margin:14px 0 2px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun-2)}
label.it{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
h4+label.it,.cb>label.it:first-child{border-top:0}
label.it input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);margin:1px 0 0;display:grid;place-content:center;background:transparent;transition:all .15s}
label.it input:checked{background:var(--ok);border-color:var(--ok)}
label.it input:checked::after{content:"";width:6px;height:12px;border:solid var(--night);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.txt{display:grid;gap:5px;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--night-3);color:var(--muted)}
.tag.miss{background:rgba(255,122,154,.16);color:var(--bad)}
.tag.unv{background:rgba(255,200,87,.14);color:var(--warn)}
.tag.cash{background:rgba(79,220,141,.14);color:var(--ok)}
.tag.fr{background:rgba(63,214,198,.14);color:var(--teal)}
.tag.save{background:rgba(155,107,255,.2);color:#c7a8ff}
.tag.code{background:rgba(255,179,71,.14);color:var(--sun-2)}
label.it.dn .txt>span{color:#6f6488;text-decoration:line-through;text-decoration-color:rgba(79,220,141,.7)}
body.hide label.it.gone{display:none}
.card.now{border-color:var(--sun-2);box-shadow:0 0 0 1px var(--sun-2) inset}
.now-badge{display:table;margin-bottom:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(90deg,var(--sun-1),var(--sun-2));color:var(--night);font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap}
.grid.steps{grid-template-columns:1fr;max-width:760px}
.note{margin:10px 0 4px;padding:9px 12px;border-left:3px solid var(--sun-1);background:rgba(255,94,138,.08);border-radius:0 10px 10px 0;font-size:14px;color:#eadff7}
.rule{padding:10px 0;border-top:1px solid var(--line);font-size:15px}.rule:first-child{border-top:0}
.rule b{color:var(--sun-1)}
mark{background:rgba(255,179,71,.35);color:inherit;border-radius:3px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
.modal.show{display:flex}
.modal div{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:320px;text-align:center}
.modal p{margin:0 0 14px}
.modal button{margin:0 4px;padding:10px 16px;border-radius:10px;border:0;font-weight:700}
.modal .y{background:var(--sun-1);color:#fff}.modal .n{background:var(--night-3)}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="eyebrow">GTA 6 · Chapter 1 · Key Lento plan · Updated Nov 24, 2026</div>
    <h1>First 10 <span class="sun">Hours</span></h1>
    <p class="lede">Story route, cash, guns and loot, staying close to Jason's house. Tick things off as you go.</p>
    <div class="stats" id="stats"></div>
    <button class="next" id="next"></button>
  </div>
</header>
<section class="wrap" aria-label="Sections"><div class="rail" id="rail"></div></section>
<div class="controls"><div class="wrap">
  <div class="row">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#b3a8c9" stroke-width="2"/><path d="M20 20l-4-4" stroke="#b3a8c9" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search: Donnie, sniper, safe, Port Gellhorn…" autocomplete="off"></label>
    <button class="ibtn" id="hide">Hide done</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="pbar"><i id="pg"></i></div>
</div></div>
<main><div class="wrap"><div class="sech"><h2 id="sh"></h2><span id="ss"></span></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Nothing matches.</div></div></main>
<footer>Ticks save on this device · works offline once opened · <button class="ibtn" id="fold" style="padding:6px 10px">Collapse all</button> <button class="ibtn" id="reset" style="padding:6px 10px">Reset ticks</button></footer>
<div class="modal" id="m"><div><p>Untick everything?</p><button class="n" id="mn">Cancel</button><button class="y" id="my">Reset</button></div></div>
<script>
const DATA=[{"t": "Read first: 4 rules", "tab": "start", "b": [{"k": "r", "x": "Cash dies with you. Carried cash vanishes if you're killed before depositing. Bank at an ATM — no phone deposits."}, {"k": "r", "x": "Don't over-grind Chapter 1. Unlock BuckMe and Family Savings first."}, {"k": "r", "x": "Story gates need cash. Some missions won't unlock until you've raised money."}, {"k": "r", "x": "Socials = unverified. Only spots listed by multiple launch guides are included."}]}, {"t": "Before you start — Top 10 settings", "tab": "start", "b": [{"k": "i", "x": "Motion Blur Strength → 0 (Display). Default 3", "id": "94cb42d281"}, {"k": "i", "x": "Movement Speed → Run (Gameplay → Movement). Default Walk", "id": "382672410f"}, {"k": "i", "x": "Control Scheme → Classic. Sprint moves from L3 to Cross", "id": "e417062be1"}, {"k": "i", "x": "Targeting → Lock-On for early fights (Gameplay → Combat). Default Partial", "id": "8381f04936"}, {"k": "i", "x": "Aim Assist Strength → leave at 4 (scale 0–5)", "id": "79a595efe2"}, {"k": "i", "x": "Look & Aim Sensitivity → 9 (Controller). Default 7", "id": "d4a9810ef8"}, {"k": "i", "x": "Minimap → Always On (UI → Navigation Experience)", "id": "a7bffe4748"}, {"k": "i", "x": "Subtitles → All dialogue, size up, background On, speaker names On", "id": "02f512f832"}, {"k": "i", "x": "Camera Shake, Cinematic Kill Cam, Cinematic Crash Cam → Off", "id": "693c31461d"}, {"k": "i", "x": "GPS Voice → On (off by default)", "id": "8a0c235edf"}, {"k": "i", "x": "Bonus: Audio → Mute Licensed Music (only if streaming)", "id": "d78d72a348"}]}, {"t": "How to use this tab", "tab": "route", "b": [{"k": "n", "x": "Work top to bottom. Each step = story mission(s), then a free-roam break with everything nearby listed right there. Finished steps fold away; the step you're on stays open."}, {"k": "r", "x": "Every break. Explore a new patch → hit one target → lose heat → fence loot → bank at the ATM by Jason's house → refuel → manual save."}, {"k": "r", "x": "Before long drives or swamp trips. Bank first, guns in the boot, fuel checked."}, {"k": "r", "x": "Saving. Pause → Game → Save Game. 15 manual slots + 1 autosave (after missions and sleeping). No saving during missions, and none in the prologue — manual saves unlock once you reach Jason at the marina."}, {"k": "r", "x": "Slot plan. Slot 2 = rolling free-roam save (overwrite every break). Slots 3–14 = one per step, below — never overwrite those. Slot 15 = before anything risky."}, {"k": "r", "x": "Loading an old save. It overwrites your autosave. Make a fresh manual save before you load anything older."}, {"k": "r", "x": "No bank until step 7. Stash cash under the loose floorboards in Jason's bedroom."}, {"k": "r", "x": "No stolen-car buyer in Chapter 1. Moses opens in Chapter 2 — don't steal to sell yet."}]}, {"t": "1 · Prologue → Gone Fishing", "tab": "route", "b": [{"k": "h", "x": "Mission"}, {"k": "i", "x": "Prologue (Lucia)", "id": "3647ec1d3b"}, {"k": "i", "x": "Gone Fishing — search the red-and-white trailer on the way to the seaplane", "id": "68174d070c"}, {"k": "h", "x": "Free roam — fix the house (free, ~10 min)"}, {"k": "i", "x": "💾 First manual save → slot 2 (your rolling free-roam slot)", "id": "938d1a182b"}, {"k": "i", "x": "Drive back to the stilt house in Key Lento — this is base", "id": "8ee4e33041"}, {"k": "i", "x": "Fix the back deck — near the workout equipment", "id": "32a38a39bc"}, {"k": "i", "x": "Drywall the bedroom — materials in the bedroom", "id": "4f0e332ba6"}, {"k": "i", "x": "Paint the bedroom — appears after drywall", "id": "ca9b5b8f4d"}, {"k": "i", "x": "Fix the roof — ladder near the front door", "id": "33e7778a4d"}, {"k": "i", "x": "Repair the front steps — wood near Jason's car", "id": "7b20bebc64"}, {"k": "i", "x": "Check the mailbox — mission pay and Brian's fence money land there", "id": "4fba33d148"}, {"k": "i", "x": "Read all books and magazines — bedroom, dining area, balcony, downstairs counter", "id": "a1a4b55043"}, {"k": "i" const KEY='gta6plan:v1';
let st={done:{},hide:false,tab:'route'};

for(const k in MIG){if(!st.done[k]&&MIG[k].some(o=>st.done[o]))st.done[k]=1;}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};

const $=id=>document.getElementById(id);
DATA.forEach((s,si)=>{s.si=si;s.items=s.b.filter(b=>b.k==='i');s.step=/^\d+ · /.test(s.t);});
function curStep(){const steps=DATA.filter(s=>s.step);let k=-1;steps.forEach((s,i)=>{if(s.items.some(b=>st.done[b.id]))k=i;});if(k<0)return steps[0];const c=steps[k];return c.items.some(b=>!st.done[b.id])?c:steps[k+1];}

if(!TABS.some(t=>t.id===st.tab))st.tab='route';
if(location.hash&&TABS.some(t=>t.id===location.hash.slice(1)))st.tab=location.hash.slice(1);
let q='';

function tagsFor(x){
  const t=[];let txt=x;
  if(/^FREE ROAM:\s*/.test(txt)){t.push(['fr','Free roam']);txt=txt.replace(/^FREE ROAM:\s*/,'');}
  if(/missable|⚠️|point of no return|before Swamped|NOW/i.test(x))t.push(['miss','Missable']);
  if(/unverified|reportedly|\(reported|should still/i.test(x))t.push(['unv','Unverified']);
  if(/\(Ch 1–2\)/.test(x)){t.push(['fr','Early']);txt=txt.replace(/\s*\(Ch 1–2\)/,'');}
  if(/💾/.test(x)){t.push(['save','Save']);txt=txt.replace(/💾\s*/,'');}
  if(/\$\s?\d/.test(x)&&!/💾/.test(x))t.push(['cash','Cash']);
  if(/\b(safe|PC|door) [A-Z0-9]{4,}|code/i.test(x)&&/\d{4}|CLEAVES/.test(x))t.push(['code','Code']);
  return {txt,t};
}
function hl(s){if(!q)return esc(s);const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return esc(s).replace(re,'<mark>$1</mark>');}

function itemHTML(b){const g=tagsFor(b.x);return `<label class="it${st.done[b.id]?' dn gone':''}"><input type="checkbox" data-id="${b.id}"${st.done[b.id]?' checked':''}><span class="txt"><span>${hl(g.txt)}</span>${g.t.length?`<span class="tags">${g.t.map(x=>`<i class="tag ${x[0]}">${x[1]}</i>`).join('')}</span>`:''}</span></label>`;}
function pendHide(b){return itemHTML(b);}
function counts(list){let t=0,d=0;list.forEach(s=>s.items.forEach(b=>{t++;if(st.done[b.id])d++;}));return [d,t];}

function renderRail(){
  const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="#f6efe3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
  $('rail').innerHTML=TABS.map(t=>{const [d,n]=counts(DATA.filter(s=>s.tab===t.id));return `<button class="tile" data-tab="${t.id}" aria-pressed="${st.tab===t.id&&!q}"><div class="bg" style="background:linear-gradient(135deg,${t.c1},${t.c2})"></div>${svg(t.icon)}<span><strong>${t.name}</strong><small>${t.sub}</small><em>${d}/${n}</em></span></button>`;}).join('');

}
function renderGrid(){
  const list=q?DATA:DATA.filter(s=>s.tab===st.tab);

  $('sh').textContent=q?'Search':t.name;

  let html='',shown=0;
  list.forEach(s=>{
    let body='',hits=0,pendH='';
    s.b.forEach(b=>{
      if(b.k==='h'){pendH=`<h4>${esc(b.x)}</h4>`;return;}
      if(!q&&st.hide&&b.k==='i'&&st.done[b.id]){body+=pendHide(b);return;}
      if(q&&!b.x.toLowerCase().includes(q.toLowerCase())&&!s.t.toLowerCase().includes(q.toLowerCase()))return;
      if(pendH){body+=pendH;pendH='';}
      hits++;
      if(b.k==='n')body+=`<div class="note">${hl(b.x)}</div>`;
      else if(b.k==='r'){const p=b.x.split('. ');body+=`<div class="rule"><b>${hl(p[0])}.</b> ${hl(p.slice(1).join('. '))}</div>`;}
      else{const g=tagsFor(b.x);body+=`<label class="it${st.done[b.id]?' dn gone':''}"><input type="checkbox" data-id="${b.id}"${st.done[b.id]?' checked':''}><span class="txt"><span>${hl(g.txt)}</span>${g.t.length?`<span class="tags">${g.t.map(x=>`<i class="tag ${x[0]}">${x[1]}</i>`).join('')}</span>`:''}</span></label>`;}

    const [sd,sn]=counts([s]);

  });

  const i=e.target;if(!i.dataset.id)return;
  if(i.checked)st.done[i.dataset.id]=1;else delete st.done[i.dataset.id];
  document.querySelectorAll(`input[data-id="${i.dataset.id}"]`).forEach(x=>{x.checked=i.checked;const l=x.closest('label');l.classList.toggle('dn',i.checked);if(!i.checked)l.classList.remove('gone');});save();
  document.querySelectorAll('.card').forEach(c=>{const s=DATA[+c.dataset.si],[sd,sn]=counts([s]);if(!sn)return;c.querySelector('.cnt').textContent=sd+'/'+sn;c.classList.toggle('full',sd===sn);c.querySelector('.mini i').style.width=(sd/sn*100)+'%';});
  renderRail();renderTop();const [d,n]=counts(q?DATA:DATA.filter(x=>x.tab===st.tab));if(!q)$('ss').textContent=`${d} of ${n} done`;
});
function goNow(){const c=curStep();if(c)delete open[c.si];setTab('route');const el=c&&document.querySelector(`.card[data-si="${c.si}"]`);if(el){const h=document.querySelector('.controls').offsetHeight;scrollTo({top:el.getBoundingClientRect().top+scrollY-h-10,behavior:'smooth'});}}
$('next').onclick=goNow;
$('q').addEventListener('input',e=>{q=e.target.value.trim();renderRail();renderGrid();});
$('hide').onclick=()=>{st.hide=!st.hide;save();render();};
$('fold').onclick=()=>{const cards=[...document.querySelectorAll('.card')];const anyOpen=cards.some(c=>!c.classList.contains('closed'));cards.forEach(c=>{c.classList.toggle('closed',anyOpen);open[+c.dataset.si]=!anyOpen;});$('fold').textContent=anyOpen?'Expand all':'Collapse all';};
$('reset').onclick=()=>$('m').classList.add('show');
$('mn').onclick=()=>$('m').classList.remove('show');
$('my').onclick=()=>{st.done={};save();$('m').classList.remove('show');render();};
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
