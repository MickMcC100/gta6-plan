<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA 6 Plan">
<meta name="theme-color" content="#120a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>GTA 6 – First 10 Hours Checklist</title>
<style>
:root{--bg:#120a1f;--card:#1d1230;--line:#2e1f48;--txt:#f3eefc;--mut:#a99bc4;--pink:#ff3d8b;--teal:#2de2c8;--amber:#ffb340;--done:#6b5d85}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1b0f2e,#120a1fee);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 12px calc(env(safe-area-inset-left) + 16px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;letter-spacing:.2px}
h1 span{background:linear-gradient(90deg,var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--teal));border-radius:99px;transition:width .3s}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font:600 13px inherit;font-family:inherit}
.tools button.on{border-color:var(--teal);color:var(--teal)}
main{padding:12px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 12px);max-width:720px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.sh h2{flex:1;margin:0;font-size:16px;font-weight:700}
.cnt{font:600 12px ui-monospace,Menlo,monospace;color:var(--mut);background:var(--bg);border-radius:99px;padding:3px 8px;white-space:nowrap}
.cnt.full{color:var(--bg);background:var(--teal)}
.chev{color:var(--mut);transition:transform .2s;font-size:14px}
section.closed .chev{transform:rotate(-90deg)}
section.closed .sb{display:none}
.sb{padding:0 14px 12px}
.mini{height:3px;background:var(--line);margin:0 14px 10px;border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
h3{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--amber)}
label.it{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
label.it:first-child{border-top:0}
label.it input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);margin:0;display:grid;place-content:center;background:transparent;transition:all .15s}
label.it input:checked{background:var(--teal);border-color:var(--teal)}
label.it input:checked::after{content:"";width:7px;height:13px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
label.it span{padding-top:2px}
label.it.dn span{color:var(--done);text-decoration:line-through}
body.hide label.it.dn{display:none}
.note{margin:10px 0 2px;padding:10px 12px;border-left:3px solid var(--pink);background:#ff3d8b14;border-radius:0 10px 10px 0;font-size:14px;color:#e9dcff}
.rule{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rule:first-child{border-top:0}
.rule b{color:var(--pink)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:10px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:24px}
.modal.show{display:flex}
.modal div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:320px;text-align:center}
.modal p{margin:0 0 14px}
.modal button{margin:0 4px;padding:10px 16px;border-radius:10px;border:0;font:600 14px inherit;font-family:inherit}
.modal .y{background:var(--pink);color:#fff}.modal .n{background:var(--line);color:var(--txt)}
</style>
</head>
<body>
<header>
  <h1>GTA 6 · <span>First 10 Hours</span></h1>
  <div class="sub" id="sum">Key Lento plan</div>
  <div class="bar"><i id="pg"></i></div>
  <div class="tools">
    <button id="hide">Hide done</button>
    <button id="fold">Collapse all</button>
    <button id="reset">Reset</button>
  </div>
</header>
<main id="app"></main>
<footer>Ticks save on this device. Works offline once opened.</footer>
<div class="modal" id="m"><div><p>Untick everything?</p><button class="n" id="mn">Cancel</button><button class="y" id="my">Reset</button></div></div>

ls in the bedroom", "id": "d176c45e26"}, {"k": "i", "x": "Paint the bedroom — appears after drywall", "id": "bcaa571835"}, {"k": "i", "x": "Fix the roof — ladder near the front door", "id": "256de7f2a7"}, {"k": "i", "x": "Repair the front steps — wood near Jason's car", "id": "d6dc51d7d2"}, {"k": "h", "x": "First cash"}, {"k": "i", "x": "During Gone Fishing: search the red-and-white trailer on the way to the seaplane", "id": "651d97232b"}, {"k": "i", "x": "Check the mailbox — mission pay and Brian's fence money land there", "id": "12ce654c5d"}, {"k": "i", "x": "Three Sheets Liquor: vent beside the generator — ~$1,300", "id": "54eccf8ca3"}, {"k": "i", "x": "Three Sheets Liquor: back-room safe (Break Open) — ~$900", "id": "8e872af177"}, {"k": "i", "x": "Three Sheets Liquor: cash register — ~$100", "id": "d30578f821"}, {"k": "i", "x": "No bank account yet: stash cash under the loose floorboards in Jason's bedroom", "id": "823c11b0a4"}, {"k": "n", "x": "Target: house repaired, ~$2,300 stashed."}]}, {"t": "Banking: BuckMe + Family Savings", "b": [{"k": "i", "x": "After Coming Home, wait ~half an in-game day. Lucia calls → Buck Me mission", "id": "fa525df1ea"}, {"k": "i", "x": "Meet Lucia at the Fleeca branch in Key Lento, speak to the manager", "id": "64630175ba"}, {"k": "i", "x": "At home: BuckMe app (purple \"B\") → Buck Yourself → move the $100 welcome deposit to Family Savings", "id": "ef06c77917"}, {"k": "i", "x": "Deposit cash at the ATM next to Jason's house. Max $20k per deposit; Jason and Lucia each have their own account", "id": "7725ec7e9c"}, {"k": "i", "x": "⚠️ Before Tourist Trap: have $5,000 in Family Savings", "id": "93555fc8cc"}, {"k": "i", "x": "Next targets: $10k saved (rides 20% off) · $15k needed near end of Ch 2 · $100k (garages 20% off)", "id": "b23196b34b"}, {"k": "n", "x": "Family Savings is one-way — no withdrawals. Keep gun money in checking."}]}, {"t": "Hours 2–4 — Guns + steady local income", "b": [{"k": "h", "x": "Guns"}, {"k": "i", "x": "Gear Up → Chuck's Ammu-Nation (fish sign, Key Lento): Moreland 850 shotgun for $350", "id": "d2b6532e6f"}, {"k": "i", "x": "Kingfishers compound (NW of Key Lento, by boat): W-22 rifle + ~$1,000–$2,000. Guarded", "id": "375e715c02"}, {"k": "i", "x": "Optional gamble: police truck trunks outside a station (single source, adds heat)", "id": "aa4e7f9daa"}, {"k": "h", "x": "Cash"}, {"k": "i", "x": "Rob convenience stores and gas stations around Key Lento (see Store hit list)", "id": "83775bb767"}, {"k": "i", "x": "Steal cars and sell them at Pay 'n' Spray", "id": "d894b1097b"}, {"k": "i", "x": "Raid Illegal Operations for narcotics → sell to Brian or Donnie (Brian pays later at home)", "id": "1fabed5af5"}, {"k": "i", "x": "Complete Island Dreams → unlocks Kenton's treasure dives", "id": "7a555d6f50"}, {"k": "i", "x": "Complete Buck Me and move cash in", "id": "2d59523da3"}, {"k": "i", "x": "Reach $5,000 in Family Savings before Tourist Trap", "id": "44bff8a770"}, {"k": "n", "x": "Target: shotgun + W-22 owned, ~$5k in Family Savings."}]}, {"t": "Store hit list — first 10 hours", "b": [{"k": "n", "x": "Small stores don't show a security rating. Key Lento shops are the low-risk tier. Expect ~$100–$300 register + a few hundred from the safe."}, {"k": "h", "x": "Tier 1 — Key Lento"}, {"k": "i", "x": "24/7 gas station near Jason's house", "id": "dfa96e378e"}, {"k": "i", "x": "247 – Key Lento", "id": "79b048b8f1"}, {"k": "i", "x": "Leonida Key Lento Mini Mart", "id": "1c4643b5c1"}, {"k": "i", "x": "Three Sheets Liquor storefront — use the front door (back door alerts owner)", "id": "387f287253"}, {"k": "i", "x": "Any enterable diner or fast-food spot", "id": "ce5d1aa3e2"}, {"k": "h", "x": "Tier 2 — mainland"}, {"k": "i", "x": "Globe Oil Food Center – Hamlet (pair with the warehouse trip)", "id": "dc507d40f9"}, {"k": "i", "x": "Port Gellhorn green-icon stores (Lucia's motel rent; may be past hour 10)", "id": "49112ada36"}, {"k": "h", "x": "Robbery routine"}, {"k": "i", "x": "Bandana on (Key Lento gun store) — equip from items wheel", "id": "be9b4807a6"}, {"k": "i", "x": "Car parked nearby, facing out", "id": "cbb31e04bd"}, {"k": "i", "x": "Check for witnesses and cameras", "id": "cde583db55"}, {"k": "i", "x": "Gun on the clerk → register", "id": "f9c626f728"}, {"k": "i", "x": "Back room: disable alarm, get safe code from clerk, grab drugs + first-aid kits", "id": "8439cb264d"}, {"k": "i", "x": "Destroy the security footage", "id": "5828d504b2"}, {"k": "i", "x": "Drive off, change clothes if hot, bank the cash", "id": "29eb8b3f13"}, {"k": "n", "x": "Not yet: pawn shops (Ch 2, Coffee Break) · jewellers (Ch 3, Yasmani's Jewelry Jobs) · Fleeca bank (Ch 3, Credit Check)"}]}, {"t": "Hours 5–10 — Dive, stack, protect", "b": [{"k": "h", "x": "Kenton treasure dives (~$1,400+ each)"}, {"k": "i", "x": "Nuestra Señora de la Noche — just SE of Key Lento", "id": "8596f86dc6"}, {"k": "i", "x": "Nuestra Señora de la Ética Laxa — south of the first", "id": "951775680b"}, {"k": "i", "x": "Urca de Cinco Torres — SE side, by the hooked island", "id": "e677367845"}, {"k": "i", "x": "Nuestra Señora del Ocio — 10 gold doubloons", "id": "d3014743ca"}, {"k": "i", "x": "Wreck 5 (find in-game)", "id": "3ebf609fc8"}, {"k": "i", "x": "Wreck 6 (find in-game)", "id": "6a3bfc904b"}, {"k": "i", "x": "Sell the treasure to Kenton Rees", "id": "46afc93d32"}, {"k": "h", "x": "Stack and protect"}, {"k": "i", "x": "Buy the Laird 350 sniper ($950) — Expanded Ammu-Nations only", "id": "0ba375c064"}, {"k": "i", "x": "Don Gone: ⚠️ open Donnie's trunk before destroying the car → H&L .38", "id": "db26ec1781"}, {"k": "i", "x": "Trim hair/beard at home", "id": "c655326d96"}, {"k": "i", "x": "Bank everything; top up Family Savings", "id": "a3eda20ccc"}, {"k": "i", "x": "Push into Chapter 2 → Moses car sales ($1k–$20k)", "id": "1fe80af20b"}, {"k": "n", "x": "Target: ~$10k+ banked, 3+ guns, house done."}]}, {"t": "⚠️ Before Tourist Trap — point of no return", "b": [{"k": "n", "x": "Tourist Trap (\"Take Up Mattia's Offer\", after Recalibration) runs 3 missions with no free roam. You lose the house, car, carried cash and floorboard stash."}, {"k": "h", "x": "Money"}, {"k": "i", "x": "$5,000 in Family Savings via Buck Yourself", "id": "b4bc57a182"}, {"k": "i", "x": "Bank all cash and empty the floorboard stash", "id": "c004f18195"}, {"k": "i", "x": "Search the Gone Fishing trailer for cash", "id": "11cb7d8659"}, {"k": "i", "x": "Sell drugs to Donnie before Swamped — his trailer reportedly stops buying after", "id": "7df91f3b90"}, {"k": "i", "x": "Donnie's Lost Drugs — sunken boat off Corsair Key, sell to Brian for $1,200", "id": "6348f37fa4"}, {"k": "h", "x": "Missables (confirmed)"}, {"k": "i", "x": "Get Shirley's Rum, then Steal the Scooter (timed). Rum = Focus boost + borrow her car", "id": "b43b94aa94"}, {"k": "i", "x": "Mandy's Macizo cigar — pick it up outside after the sink job (Pipework)", "id": "9a5b99cb7b"}, {"k": "i", "x": "Meditate with Lucia on the balcony (after Down to Earth)", "id": "494014751d"}, {"k": "i", "x": "Find the Lost Drugs (after Down to Earth) — 4 swamp zones, use a boat", "id": "feb6b4678f"}, {"k": "i", "x": "Donnie's H&L .38 — trunk during Don Gone", "id": "203badb452"}, {"k": "i", "x": "Clock Out — reach the Community Center before 4pm game time", "id": "e76b41ee26"}, {"k": "i", "x": "Read all books and magazines — bedroom, dining area, balcony, downstairs counter", "id": "9f5b86bfbc"}, {"k": "i", "x": "Max your relationship with Lucia (carries over)", "id": "e0f3ad6254"}, {"k": "i", "x": "Ultimate Edition: bonus bike, kayak, Ganado build", "id": "603580ecec"}, {"k": "h", "x": "From socials (unverified)"}, {"k": "i", "x": "Ring the Bell! with Cal — Rusty Anchor cap + T-shirt", "id": "8ab66a112f"}, {"k": "i", "x": "Lucia's sunglasses — yacht middle deck during Time Off", "id": "5c6ae69bda"}, {"k": "i", "x": "Donnie's aviators — trailer bathroom during Don Gone", "id": "e945773876"}, {"k": "i", "x": "Andy's jacket — call Andy in Home Sweet Home, reach her car undetected", "id": "2670f27679"}, {"k": "h", "x": "Last step"}, {"k": "i", "x": "Manual save in its own slot — never overwrite it", "id": "28f10882a4"}]}, {"t": "Free-roam loop (repeat)", "b": [{"k": "i", "x": "Explore a new patch — clear map fog, note targets and escape routes", "id": "07c3e6b712"}, {"k": "i", "x": "Hit one target from the Store hit list", "id": "73b1018d44"}, {"k": "i", "x": "Lose any heat — change clothes or respray", "id": "d3837428ac"}, {"k": "i", "x": "Fence the loot (Brian, Donnie, Pay 'n' Spray)", "id": "a6541a4c39"}, {"k": "i", "x": "Bank the cash at the ATM by Jason's house", "id": "c3d11db389"}, {"k": "i", "x": "Refuel / repair", "id": "3db45d5a07"}, {"k": "i", "x": "Manual save, then pick: another lap, side job or story", "id": "c2d4b585b6"}, {"k": "n", "x": "Before long drives or swamp trips: bank first, guns in the trunk, fuel checked."}]}, {"t": "Habits (every session)", "b": [{"k": "i", "x": "Manual save + backup slot before every story mission", "id": "1b6585a007"}, {"k": "i", "x": "Bank cash after every job", "id": "21425d233f"}, {"k": "i", "x": "Keep a cash buffer in checking", "id": "2126043b0e"}, {"k": "i", "x": "Fence stolen goods — loot isn't cash until sold", "id": "9b3f9840be"}, {"k": "i", "x": "Check fuel before long drives", "id": "a4a3fe2d67"}, {"k": "i", "x": "Use the map to find entrances, back rooms and loot", "id": "b304088584"}]}, {"t": "Heat, cars and danger", "b": [{"k": "i", "x": "No witness, no stars — check for people and cameras", "id": "0f0852eeb5"}, {"k": "i", "x": "Hit and run — leave before cops arrive, don't escalate", "id": "3b2506a41e"}, {"k": "i", "x": "3 stars: ditch the car unless it's very fast", "id": "ac36fbb7d9"}, {"k": "i", "x": "Shed heat — change clothes/hair or respray (cooldown)", "id": "888f83b1e9"}, {"k": "i", "x": "Get the safe code — blasting damages loot", "id": "f24c23a15e"}, {"k": "i", "x": "Cheap cars first — slim jim / key cloner come later", "id": "4b1c721531"}, {"k": "i", "x": "Expensive cars may have GPS trackers", "id": "9d29fbe363"}, {"k": "i", "x": "Grassrivers swamps = gators. Stay in the boat", "id": "ebfe4762ac"}, {"k": "i", "x": "Coffee = stamina, protein shake = health", "id": "2e02ed98ca"}]}, {"t": "Fitness (optional, at home)", "b": [{"k": "i", "x": "Strength: weights on the back deck or a gym", "id": "d8e7a3deb8"}, {"k": "i", "x": "Stamina: treadmill, bike, running, swimming", "id": "2b8ff0e7f6"}, {"k": "i", "x": "Focus: shooting range, golf, pool, fishing", "id": "7f43f375d1"}, {"k": "i", "x": "Eat and sleep well — both characters", "id": "fc26dc3607"}]}, {"t": "Optional — leaving Key Lento", "b": [{"k": "i", "x": "Hamlet warehouse: ~$13k + Type 9 SMG + rare card (~$6k)", "id": "721ecd08f0"}, {"k": "i", "x": "Crabshack VF5 SMG — Pelican Valley outpost. PC CLEAVES, safe 0072, door 0212", "id": "3eb5bdb5fa"}, {"k": "i", "x": "Swamp cabin, Pelican Valley — Akulus revolver + SM-69 sniper, no fight", "id": "ac34581e14"}, {"k": "i", "x": "SM-69 at a Key Lento tower (unverified)", "id": "79be93973d"}, {"k": "i", "x": "\"Paul Walker\" green tuner — Vice City (unverified)", "id": "3e1d6f7afb"}]}];
const KEY='gta6plan:v1';
let st={done:{},closed:{},hide:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const app=document.getElementById('app');
DATA.forEach((s,si)=>{
  const items=s.b.filter(b=>b.k==='i');
  const sec=document.createElement('section');
  if(st.closed[si]) sec.classList.add('closed');
  let h=`<div class="sh"><h2>${esc(s.t)}</h2>${items.length?`<span class="cnt"></span>`:''}<span class="chev">▼</span></div>`;
  if(items.length) h+=`<div class="mini"><i></i></div>`;
  h+='<div class="sb">';
  s.b.forEach(b=>{
    if(b.k==='h') h+=`<h3>${esc(b.x)}</h3>`;
    else if(b.k==='n') h+=`<div class="note">${esc(b.x)}</div>`;
    else if(b.k==='r'){const p=b.x.split('. ');h+=`<div class="rule"><b>${esc(p[0])}.</b> ${esc(p.slice(1).join('. '))}</div>`;}
    else h+=`<label class="it${st.done[b.id]?' dn':''}"><input type="checkbox" data-id="${b.id}"${st.done[b.id]?' checked':''}><span>${esc(b.x)}</span></label>`;
  });
  sec.innerHTML=h+'</div>';
  sec.querySelector('.sh').onclick=()=>{sec.classList.toggle('closed');st.closed[si]=sec.classList.contains('closed');save();};
  sec._items=items;
  app.appendChild(sec);
});
function update(){
  let t=0,d=0;
  app.querySelectorAll('section').forEach(sec=>{
    const it=sec._items;if(!it.length)return;
    const dd=it.filter(b=>st.done[b.id]).length;t+=it.length;d+=dd;
    const c=sec.querySelector('.cnt');c.textContent=dd+'/'+it.length;c.classList.toggle('full',dd===it.length);
    sec.querySelector('.mini i').style.width=(dd/it.length*100)+'%';
  });
  document.getElementById('pg').style.width=(t?d/t*100:0)+'%';
  document.getElementById('sum').textContent=`${d} of ${t} done · ${t?Math.round(d/t*100):0}%`;
}
app.addEventListener('change',e=>{
  const i=e.target;if(!i.dataset.id)return;
  if(i.checked) st.done[i.dataset.id]=1; else delete st.done[i.dataset.id];
  i.closest('label').classList.toggle('dn',i.checked);
  save();update();
});
const hb=document.getElementById('hide');
const applyHide=()=>{document.body.classList.toggle('hide',st.hide);hb.classList.toggle('on',st.hide);hb.textContent=st.hide?'Show done':'Hide done';};
hb.onclick=()=>{st.hide=!st.hide;save();applyHide();};
document.getElementById('fold').onclick=()=>{
  const secs=[...app.querySelectorAll('section')];const anyOpen=secs.some(s=>!s.classList.contains('closed'));
  secs.forEach((s,i)=>{s.classList.toggle('closed',anyOpen);st.closed[i]=anyOpen;});
  document.getElementById('fold').textContent=anyOpen?'Expand all':'Collapse all';save();
};
const m=document.getElementById('m');
document.getElementById('reset').onclick=()=>m.classList.add('show');
document.getElementById('mn').onclick=()=>m.classList.remove('show');
document.getElementById('my').onclick=()=>{st.done={};save();app.querySelectorAll('input').forEach(i=>{i.checked=false;i.closest('label').classList.remove('dn');});update();m.classList.remove('show');};
applyHide();update();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
